  ui[5]: ""
  ui[6]: ""
  ui[7]: ""
  uo[0]: "BUZZER"
  uo[1]: "ALARM_RED_LED"
  uo[2]: "COUNTDOWN_AMBER_LED"
  uo[3]: "SAFE_GREEN_LED"
  uo[4]: "ALARM_LATCHED"
  uo[5]: "SEAT_STATUS"
  uo[6]: "IGNITION_STATUS"
  uo[7]: "DOOR_STATUS"
