# Tiny Tapeout project information
project:
  title:        "ALERTA-8: Child Seat Reminder"
  author:       "Jesús Eduardo Martínez Tinajero"
  discord:      ""
  description:  "Digital reminder that alarms when an occupied child seat remains after the driver exits."
  language:     "Verilog"
  clock_hz:     50000000
  tiles:        "1x1"
  top_module:   "tt_um_ieeebootcamp3_creator_alerta8"
  source_files:
    - "project.v"

